<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>馮志遠主任 · 中華基督教會基慈小學</title>
<meta name="description" content="馮志遠主任 電子名片 — 中華基督教會基慈小學" />
<meta property="og:title" content="馮志遠主任 · 中華基督教會基慈小學" />
<meta property="og:description" content="電子名片 Virtual Card" />
<meta property="og:image" content="logo.png" />
<meta property="og:type" content="profile" />
<link rel="icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --red:#d23a30;
    --red-soft:#ef6b62;
    --blue:#2e3192;
    --blue-soft:#5b62d8;
    --sky:#bfe3ff;
    --cream:#fff8ef;
    --ink:#3a3550;
    --muted:#8a86a0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"Baloo 2","Noto Sans TC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(900px 500px at 12% -8%, #ffe6e2, transparent 60%),
      radial-gradient(900px 520px at 110% 8%, #dfe6ff, transparent 60%),
      linear-gradient(165deg,#fff5f0 0%,#eef4ff 60%,#f3eaff 100%);
    min-height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:18px;
    padding:26px 16px 34px;
  }

  main{
    display:flex; flex-direction:column;
    align-items:center; gap:16px; width:100%;
  }

  /* ---------- 名片 ---------- */
  .card{
    position:relative;
    width:100%; max-width:392px;
    background:var(--cream);
    border-radius:30px;
    border:3px solid #fff;
    box-shadow:
      0 26px 50px -18px rgba(46,49,146,.32),
      0 8px 20px -10px rgba(210,58,48,.20),
      inset 0 0 0 4px rgba(255,255,255,.6);
    overflow:hidden;
    padding-bottom:26px;
  }

  /* 頂部彩色天空 banner */
  .sky{
    position:relative;
    height:150px;
    background:#cfe0ee url("banner.jpg") center 38% / cover no-repeat;
    overflow:hidden;
  }
  .sky::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,
      rgba(20,30,60,.10) 0%,
      rgba(20,30,60,0) 32%,
      rgba(255,248,239,.10) 74%,
      rgba(255,248,239,.55) 100%);
  }

  /* 個人頭像 + 校徽小章 */
  .avatar-wrap{
    position:absolute; left:50%; top:86px; transform:translateX(-50%);
    width:124px; height:124px; z-index:3;
    animation:pop .6s cubic-bezier(.34,1.56,.64,1) both;
  }
  .avatar{
    width:124px; height:124px; border-radius:50%;
    object-fit:cover; display:block;
    border:5px solid #fff;
    box-shadow:0 12px 26px rgba(46,49,146,.30);
    background:#fff;
  }
  .logo-badge{
    position:absolute; right:-4px; bottom:-2px;
    width:50px; height:50px; border-radius:50%;
    background:#fff; border:3px solid #fff;
    box-shadow:0 6px 14px rgba(46,49,146,.3);
    display:flex; align-items:center; justify-content:center;
  }
  .logo-badge img{width:40px;height:40px;object-fit:contain}
  @keyframes pop{0%{transform:translateX(-50%) scale(.4);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}

  .body{padding:74px 24px 0;text-align:center}
  .name{
    font-family:"Baloo 2","Noto Sans TC",sans-serif;
    font-size:36px; font-weight:800; letter-spacing:2px;
    color:var(--blue);
    line-height:1.1;
  }
  .title-pill{
    display:inline-block; margin-top:10px;
    padding:5px 18px; border-radius:999px;
    background:linear-gradient(135deg,var(--red),var(--red-soft));
    color:#fff; font-weight:700; font-size:15px; letter-spacing:2px;
    box-shadow:0 6px 14px -6px rgba(210,58,48,.7);
  }

  /* 學歷 badges */
  .edu{
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
    margin-top:18px;
  }
  .edu .badge{
    display:flex; align-items:center; gap:7px;
    padding:9px 15px; border-radius:16px;
    background:#fff;
    border:2px solid #ede6ff;
    box-shadow:0 6px 14px -10px rgba(46,49,146,.5);
  }
  .edu .badge .cap{line-height:0;color:var(--blue)}
  .edu .badge .cap svg{width:20px;height:20px;display:block}
  .edu .badge .lab{text-align:left;line-height:1.15}
  .edu .badge .deg{font-size:15px;font-weight:800;color:var(--blue)}
  .edu .badge .deg small{font-size:12px;color:var(--muted);font-weight:600}
  .edu .badge .zh{font-size:11px;color:var(--muted);font-weight:600}

  .rule{
    width:70px; height:5px; margin:20px auto 16px;
    background:linear-gradient(90deg,var(--red),#ffcf3a,var(--blue));
    border-radius:6px;
  }

  .school{
    font-family:"Noto Sans TC",sans-serif;
    font-size:18px; font-weight:900; color:var(--ink); letter-spacing:1px;
  }
  .school-en{margin-top:3px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.4px}

  .mail{
    display:inline-flex; align-items:center; gap:9px;
    margin-top:16px; padding:11px 18px;
    border-radius:16px; text-decoration:none;
    background:linear-gradient(135deg,#eef3ff,#fdeef0);
    border:2px solid #fff;
    color:var(--ink); font-weight:700; font-size:14px;
    box-shadow:0 6px 14px -10px rgba(46,49,146,.5);
  }
  .mail .e{line-height:0;color:var(--red)}
  .mail .e svg{width:18px;height:18px;display:block}

  /* 截圖按鈕（在卡片外） */
  .cap-btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:15px 30px; border:none; cursor:pointer;
    border-radius:999px;
    font-family:"Baloo 2","Noto Sans TC",sans-serif;
    font-size:17px; font-weight:800; letter-spacing:1px;
    color:#fff;
    background:linear-gradient(135deg,var(--blue),var(--blue-soft));
    box-shadow:0 12px 24px -10px rgba(46,49,146,.75);
    transition:transform .15s ease, box-shadow .15s ease, opacity .2s;
  }
  .cap-btn:hover{transform:translateY(-2px) scale(1.02)}
  .cap-btn:active{transform:translateY(0) scale(.98)}
  .cap-btn .ic{line-height:0}
  .cap-btn .ic svg{width:20px;height:20px;display:block}
  .cap-btn.busy{opacity:.7;pointer-events:none}
  .spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;display:inline-block;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hint{font-size:12px;color:var(--muted);margin-top:-6px}

  @media (max-width:380px){
    .name{font-size:32px}
    .body{padding:66px 18px 0}
  }
</style>
</head>
<body>
  <main>
    <section class="card" id="card">
      <div class="sky"></div>
      <div class="avatar-wrap">
        <img class="avatar" src="portrait.png" alt="馮志遠主任" />
        <span class="logo-badge"><img src="logo.png" alt="中華基督教會基慈小學校徽" /></span>
      </div>

      <div class="body">
        <h1 class="name">馮志遠</h1>
        <div class="title-pill">主任 · Master</div>

        <div class="edu">
          <div class="badge">
            <span class="cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1 2.7 2.5 6 2.5s6-1.5 6-2.5v-5"/><path d="M22 10v6"/></svg></span>
            <span class="lab">
              <span class="deg">M.Ed <small>教育碩士</small></span>
            </span>
          </div>
          <div class="badge">
            <span class="cap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1 2.7 2.5 6 2.5s6-1.5 6-2.5v-5"/><path d="M22 10v6"/></svg></span>
            <span class="lab">
              <span class="deg">B.Ed <small>教育學士</small></span>
            </span>
          </div>
        </div>

        <div class="rule"></div>

        <div class="school">中華基督教會基慈小學</div>
        <div class="school-en">CCC Kei Tsz Primary School</div>

        <a class="mail" href="mailto:fcy@keitsz.edu.hk">
          <span class="e"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></span> fcy@keitsz.edu.hk
        </a>
      </div>
    </section>

    <button class="cap-btn" id="capBtn" type="button">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.5"/></svg></span> 截圖儲存名片
    </button>
    <div class="hint">一鍵儲存為圖片，方便分享</div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script>
    const capBtn = document.getElementById("capBtn");
    const card = document.getElementById("card");
    capBtn.addEventListener("click", async () => {
      if (!window.html2canvas) return;
      capBtn.classList.add("busy");
      const original = capBtn.innerHTML;
      capBtn.innerHTML = '<span class="spin"></span> 生成中…';
      try {
        const canvas = await html2canvas(card, {
          scale: Math.max(2, window.devicePixelRatio || 1),
          backgroundColor: null,
          useCORS: true,
          logging: false
        });
        const link = document.createElement("a");
        link.download = "馮志遠_名片.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      } catch (e) {
        console.error(e);
        alert("生成圖片失敗，請再試一次。");
      } finally {
        capBtn.classList.remove("busy");
        capBtn.innerHTML = original;
      }
    });
  </script>
</body>
</html>
